[package]
name = "euroscope"
description = "Safe, idiomatic Rust interface for writing EuroScope plugins"
version = "0.0.4"
authors.workspace = true
edition.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories = ["aerospace::simulation", "api-bindings"]

[features]
default = ["tracing"]
tracing = ["dep:tracing", "dep:tracing-subscriber", "dep:parking_lot"]

[dependencies]
parking_lot = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
winapi.workspace = true

euroscope-sys = { path = "../euroscope-sys", version = "0.0.4" }

[lints]
workspace = true

[package.metadata.docs.rs]
default-target = "i686-pc-windows-msvc"
targets = []
